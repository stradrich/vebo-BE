<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vebo Home Page</title>
    <style>
        /* Reset default margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Make body full height */
        html, body {
            height: 100%;
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            max-width: 300px;
            height: auto;
        }

        .welcome-container {
            text-align: center;
            margin-bottom: 20px; /* Space between welcome text and button */
        }

        h1 {
            font-size: 2em;
            color: #2c3e50;
        }

        .name-form input[type="text"] {
            font-size: 16px; /* Normal input text size */
            padding-left: 60px;
        }

        .name-form input[type="text"]::placeholder {
            font-size: 10px; /* Smaller placeholder text size */
            /* padding-left: 20px; */
            color: grey; /* Optional: lighter color for the placeholder */
        }

        .container-1 {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #34495e;
        }

        .hidden {
            display: none;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.querySelector(".name-form form");
            const nameInput = form.querySelector("input[name='name']");
            const nameSpan = document.querySelector(".welcome-container h1 span");
            const nameFormDiv = document.querySelector(".name-form");

            form.addEventListener("submit", (e) => {
                e.preventDefault(); // Prevent the form from submitting normally
                const name = nameInput.value.trim();

                if (name) {
                    nameSpan.textContent = name; // Update the welcome message
                    nameFormDiv.classList.add("hidden"); // Hide the form
                }
            });
        });
    </script>
</head>
<body>
    <div class="logo-container">
        <img src="https://static.wixstatic.com/media/febb1b_7210d878b3d74c8abc8fa453df28c0b1~mv2.png/v1/fill/w_388,h_194,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/vebo_logo_FA.png" alt="VEBO Logo" class="logo">
    </div>
    <div class="welcome-container">
        <h1>Welcome, <span th:text="${name}"></span>!</h1>
    </div>
    <!-- <div class="name-form"> -->
        <!-- Form for user to input their name -->
        <!-- <form action="/home-page" method="post"> -->
            <!-- <input type="text" name="name" placeholder="Please enter your name" required> -->
            <!-- No submit button; press Enter to trigger submission -->
        <!-- </form> -->
    <!-- </div> -->
    <div class="container-1">
        <button>Get Started</button>
    </div>
</body>
</html>
